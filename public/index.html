<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flix — Search & Stream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app">
    <header class="header">
      <h1 class="logo">Flix</h1>
      <form class="search-form" id="search-form">
        <div class="search-wrap">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="search-input" id="search-input" type="text" placeholder="Search movies & TV series..." autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="search-clear hidden" id="search-clear" type="button" aria-label="Clear search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </form>
    </header>

    <main class="main">
      <section class="section" id="results-section">
        <div class="results-grid" id="results-grid"></div>
        <div class="state-message hidden" id="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          <p>Search for a movie or TV series to start</p>
        </div>
        <div class="state-message hidden" id="loading-state">
          <div class="spinner"></div>
          <p>Searching...</p>
        </div>
        <div class="state-message hidden" id="error-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <p id="error-message">Something went wrong</p>
          <button class="btn btn-ghost" id="retry-btn">Try again</button>
        </div>
      </section>

      <section class="section hidden" id="tv-section">
        <button class="btn btn-back" id="tv-back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to results
        </button>
        <div class="tv-header" id="tv-header">
          <div class="tv-poster" id="tv-poster"></div>
          <div class="tv-meta">
            <h2 class="tv-title" id="tv-title"></h2>
            <p class="tv-overview" id="tv-overview"></p>
            <div class="season-selector">
              <label for="season-select">Season</label>
              <select id="season-select"></select>
            </div>
          </div>
        </div>
        <div class="episodes-grid" id="episodes-grid"></div>
        <div class="state-message hidden" id="tv-loading">
          <div class="spinner"></div>
        </div>
      </section>

      <section class="section hidden" id="player-section">
        <button class="btn btn-back" id="player-back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back
        </button>
        <div class="player-title" id="player-title"></div>
        <div class="player-wrap">
          <iframe class="player-iframe" id="player-iframe" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
