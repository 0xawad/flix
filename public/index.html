<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flix — Search & Stream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <header class="header">
    <div class="header-inner">
      <h1 class="logo">Flix</h1>
      <form class="search-form" id="search-form">
        <div class="search-wrap">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="search-input" id="search-input" type="text" placeholder="Search movies & TV..." autocomplete="off">
          <button class="search-clear hidden" id="search-clear" type="button" aria-label="Clear">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </form>
    </div>
  </header>

  <main class="main">

    <section class="view" id="results-view">
      <div class="view-header">
        <span class="view-label" id="results-label">Results</span>
        <span class="view-count" id="results-count"></span>
      </div>
      <div class="results-grid" id="results-grid"></div>
      <div class="state hidden" id="results-empty">
        <p>No results found</p>
      </div>
      <div class="state hidden" id="results-loading">
        <div class="spinner"></div>
      </div>
      <div class="state hidden" id="results-error">
        <p id="results-error-msg">Something went wrong</p>
        <button class="btn" id="results-retry">Retry</button>
      </div>
    </section>

    <section class="view hidden" id="tv-view">
      <button class="btn-back" id="tv-back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back
      </button>
      <div class="tv-hero" id="tv-hero">
        <div class="tv-poster" id="tv-poster"></div>
        <div class="tv-info">
          <h2 class="tv-title" id="tv-title"></h2>
          <p class="tv-overview" id="tv-overview"></p>
          <div class="season-row">
            <label class="season-label">Season</label>
            <div class="season-wrap">
              <select id="season-select"></select>
              <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
          </div>
        </div>
      </div>
      <div class="episodes-list" id="episodes-list"></div>
      <div class="state hidden" id="tv-loading">
        <div class="spinner"></div>
      </div>
    </section>

    <section class="view hidden" id="player-view">
      <button class="btn-back" id="player-back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back
      </button>
      <div class="player-meta" id="player-meta"></div>
      <div class="player-wrap">
        <iframe class="player-iframe" id="player-iframe" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </div>
    </section>

  </main>

  <script src="/js/app.js"></script>
</body>
</html>
