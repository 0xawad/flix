<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07070c">
  <meta name="description" content="Search movies and TV series and start watching in seconds.">
  <title>Flix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Flix">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/css/style.css?v=e38b547d58">
</head>
<body>

  <svg class="sprite" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><line x1="20.5" y1="20.5" x2="16.4" y2="16.4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 4.5v15L16 12z" fill="currentColor" stroke="none"/><line x1="19" y1="5" x2="19" y2="19"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12" y2="8"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v11"/><polyline points="7.5 10 12 14.5 16.5 10"/><path d="M4.5 15.5v3a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12"/><polyline points="7.5 7.5 12 3 16.5 7.5"/><path d="M8 10.5H6.5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H16"/></symbol>
    <symbol id="i-add" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="4" x2="7" y2="20"/><line x1="17" y1="4" x2="17" y2="20"/><line x1="3" y1="12" x2="21" y2="12"/></symbol>
  </svg>

  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#/" aria-label="Flix home">flix<span class="logo-dot"></span></a>
      <form class="search" id="search-form" role="search" autocomplete="off">
        <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input class="search-input" id="search-input" type="search" name="q" placeholder="Search movies & TV" aria-label="Search movies and TV" enterkeyhint="search" maxlength="100">
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
        <button class="search-clear hidden" id="search-clear" type="button" aria-label="Clear search">
          <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </form>
      <button class="install-btn hidden" id="install-btn" type="button" aria-label="Install the Flix app">
        <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span class="install-label">Install</span>
      </button>
    </div>
  </header>

  <main class="main" id="main">
    <section class="view" id="view-home" aria-label="Home"></section>
    <section class="view" id="view-search" aria-label="Search results"></section>
    <section class="view" id="view-title" aria-label="Title details"></section>
    <section class="view" id="view-player" aria-label="Player"></section>
  </main>

  <div class="verify-overlay hidden" id="verify-overlay" role="dialog" aria-modal="true" aria-labelledby="verify-title">
    <div class="verify-box">
      <p class="verify-title" id="verify-title">Quick check that you're human</p>
      <div id="verify-widget"></div>
    </div>
  </div>

  <dialog class="sheet" id="install-sheet" aria-labelledby="install-sheet-title">
    <div class="sheet-body">
      <img class="sheet-icon" src="/icons/icon-192.png" alt="" width="56" height="56">
      <h2 class="sheet-title" id="install-sheet-title">Install Flix</h2>
      <p class="sheet-text">Add Flix to your Home Screen to open it full screen, like any other app.</p>
      <ol class="sheet-steps">
        <li><span class="sheet-step-icon"><svg class="icon" aria-hidden="true"><use href="#i-share"/></svg></span><span>Tap <strong>Share</strong> in the browser toolbar</span></li>
        <li><span class="sheet-step-icon"><svg class="icon" aria-hidden="true"><use href="#i-add"/></svg></span><span>Choose <strong>Add to Home Screen</strong></span></li>
        <li><span class="sheet-step-icon sheet-step-num">3</span><span>Tap <strong>Add</strong></span></li>
      </ol>
      <form method="dialog"><button class="btn btn-primary sheet-close" type="submit">Got it</button></form>
    </div>
  </dialog>

  <script src="/js/app.js?v=310612490c"></script>
</body>
</html>
